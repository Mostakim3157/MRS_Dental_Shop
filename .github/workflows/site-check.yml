name: site check
on:
  push:
    branches: [claude/tender-bardeen-3lra27]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: DNS
        run: |
          sudo apt-get -qq install -y dnsutils whois >/dev/null 2>&1 || true
          for t in NS SOA A AAAA; do echo "== mrsdentalshop.com $t"; dig +short mrsdentalshop.com $t @8.8.8.8; done
          echo "== www CNAME"; dig +short www.mrsdentalshop.com CNAME @8.8.8.8
          echo "== www A"; dig +short www.mrsdentalshop.com A @8.8.8.8
          echo "== status"; dig mrsdentalshop.com @8.8.8.8 | grep -E "status"
          echo "== whois"; whois mrsdentalshop.com | grep -iE "domain name|registrar:|name server|status|expir|creation" | head -20 || true
      - name: HTTP
        run: |
          for u in https://www.mrsdentalshop.com/director http://www.mrsdentalshop.com/director https://mrsdentalshop.com/director https://mostakim3157.github.io/MRS_Dental_Shop/director/; do
            echo "== $u"; curl -sS -o /dev/null -L --max-time 20 -w "%{http_code} final=%{url_effective}\n" "$u" || true
          done
