name: site check
on:
  push:
    branches: [claude/tender-bardeen-3lra27]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Live files
        run: |
          echo "== live HTML stylesheet link"; curl -sS https://www.mrsdentalshop.com/director/ | grep -n 'rel="stylesheet" href="director' || echo NOT FOUND
          echo "== live HTML last-modified"; curl -sSI https://www.mrsdentalshop.com/director/ | grep -i last-modified
          echo "== versioned CSS has label rule?"; curl -sS "https://www.mrsdentalshop.com/director/director.css?v=20261019" | grep -n -A3 "max-width: 759px" || echo NOT FOUND
      - name: Render like a phone
        run: |
          npx -y playwright@1.56.0 install chromium >/dev/null 2>&1
          cat > shot.mjs <<'JS'
          import { chromium, devices } from 'playwright';
          const b = await chromium.launch();
          for (const name of ['Pixel 7', 'iPhone 14 Pro Max', 'Galaxy S9+']) {
            const ctx = await b.newContext({ ...devices[name] });
            const p = await ctx.newPage();
            await p.goto('https://www.mrsdentalshop.com/director/', { waitUntil: 'networkidle' });
            const r = await p.evaluate(() => {
              const l = document.querySelector('.action__label');
              const s = getComputedStyle(l);
              return { vw: innerWidth, labelWidth: l.getBoundingClientRect().width, clip: s.clipPath, pos: s.position };
            });
            console.log(name, JSON.stringify(r));
          }
          await b.close();
          JS
          npm i -s playwright@1.56.0 >/dev/null 2>&1 && node shot.mjs
